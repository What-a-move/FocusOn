# server/에서 실행하면 .env, 저장소 루트에서 실행하면 server/.env를 읽는다.
# 같은 키가 있으면 OS 환경변수가 우선하며, 파일은 Git에 포함하지 않는다.
spring.config.import=optional:file:./.env[.properties],optional:file:./server/.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:${POSTGRES_HOST_PORT:5432}}/${POSTGRES_DB:focuson}
spring.datasource.username=${POSTGRES_USER:focuson}
spring.datasource.password=${POSTGRES_PASSWORD}

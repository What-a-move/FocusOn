spring.application.name=focuson-backend
logging.structured.format.console=logstash
logging.structured.json.rename.[@timestamp]=ts
logging.structured.json.add.module=backend
spring.profiles.default=local
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# 직접 연결의 IP를 한도 기준으로 사용한다. 배포 proxy 신뢰 설정은 별도 구성한다.
server.forward-headers-strategy=none

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

focuson.jwt.issuer=focuson
focuson.jwt.audience=focuson-api
focuson.jwt.secret-base64=${JWT_SECRET_BASE64:}

focuson.google.client-id=${GOOGLE_DESKTOP_CLIENT_ID:}
focuson.google.client-secret=${GOOGLE_DESKTOP_CLIENT_SECRET:}

# local 개발 프로필에서만 활성화한다. docker/test에서는 기본 비활성이다.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

focuson.pairing.secret-base64=${PAIRING_SECRET_BASE64:}

# 콤마로 구분한 확장 origin. 기본값은 전체 불허.
focuson.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# AI는 서비스 전용 주소/키를 사용한다. 미설정이면 UNCERTAIN으로 안전하게 기록한다.
focuson.analysis.ai-url=${AI_ANALYSIS_URL:}
focuson.analysis.api-key=${FOCUSON_AI_API_KEY:}

<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FocusOn 화면 OCR 권한</title><link rel="stylesheet" href="permissions.css"></head>
<body><main><h1>현재 탭 OCR 권한</h1><p>페이지의 글을 직접 읽기 어려울 때만, 현재 보이는 탭을 이 기기에서 OCR로 읽습니다. 화면 이미지는 서버로 보내거나 저장하지 않습니다.</p><p>자동으로 현재 탭을 캡처하려면 Chrome의 모든 사이트 화면 접근 권한이 필요합니다. 허용해도 활성 학습 세션과 제외·개인정보 검사를 통과한 화면에서만 실행합니다.</p><button id="allow" type="button">화면 OCR 권한 허용</button><p id="status" role="status" aria-live="polite">권한 확인 중</p><p>권한은 Chrome 확장 프로그램 설정에서 철회할 수 있습니다.</p></main><script type="module" src="permissions.js"></script></body>
</html>

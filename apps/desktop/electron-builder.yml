# 베타 설치 파일(.dmg). `pnpm dist`로 만든다(서버 주소·Google Client ID는 빌드할 때 환경 변수로 넣는다).
appId: com.focuson.desktop
productName: FocusOn
directories:
  output: release
  buildResources: resources
files:
  - dist-electron/**/*
  - out/**/*
  - package.json
# 화면 관측 도우미(Swift)는 앱 Resources에 둔다(index.cts: process.resourcesPath/focuson-observer).
extraResources:
  - from: build/native/focuson-observer
    to: focuson-observer
mac:
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.productivity
  # ponytail: Apple 개발자 인증서 없이 임시 서명(ad-hoc)만 한다. 공증(notarize)은 개발자 계정이 생기면 붙인다.
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    NSCameraUsageDescription: 카메라 분석을 켠 경우에만, 얼굴·시선 상태를 이 Mac 안에서 계산해 오래 자리를 비운 순간을 알아차리는 데 써요. 영상은 저장하지 않아요.
dmg:
  title: FocusOn

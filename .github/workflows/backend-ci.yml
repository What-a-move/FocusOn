name: Backend CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test server
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            server/build.gradle
            server/settings.gradle
            server/gradle/wrapper/gradle-wrapper.properties
      - name: Build and test
        working-directory: server
        run: ./gradlew build --no-daemon

  postgres-nickname-concurrency:
    name: PostgreSQL nickname concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: focuson_test
          POSTGRES_USER: focuson_test
          POSTGRES_PASSWORD: focuson_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U focuson_test -d focuson_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            server/build.gradle
            server/settings.gradle
            server/gradle/wrapper/gradle-wrapper.properties
      - name: Test nickname conflict with Flyway schema
        working-directory: server
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/focuson_test
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: focuson_test
          SPRING_DATASOURCE_PASSWORD: focuson_test
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
          SPRING_FLYWAY_ENABLED: 'true'
        run: ./gradlew test --tests '*UserConfigurationApiTests.concurrentNicknameConflictsOnPostgres' --no-daemon --rerun-tasks

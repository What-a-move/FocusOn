name: Frontend CI

on:
  pull_request:
    branches: [dev]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [dev]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop test, typecheck, lint
    # Swift 화면 도우미(build:electron)까지 빌드해서 깨지면 잡도록 macOS에서 돌린다.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test (Electron main + Swift helper build)
        run: pnpm --filter @focuson/desktop test:electron
      - name: Typecheck
        working-directory: apps/desktop
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm --filter @focuson/desktop lint

  extension:
    name: Extension test, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm --filter @focuson/extension test
      - name: Lint
        run: pnpm --filter @focuson/extension lint
      - name: Build (includes typecheck)
        run: pnpm --filter @focuson/extension build
